name: Project checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check published deliverables and provenance
        run: python -m freight.audit --output-dir tmp/ci-audit
      - name: Run supplied scorer
        run: python score.py --predictions validation_predictions.csv --december-predictions december_predictions.csv --output-dir tmp/ci-scorer
